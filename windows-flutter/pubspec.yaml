name: worktool
description: "WorkTool for Windows (Flutter) — 탁송체크·이체파일"
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.7
  fluent_ui: ^4.18.1
  flutter_acrylic: ^1.1.4
  pasteboard: ^0.6.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  file_selector: ^1.1.0
  desktop_drop: ">=0.5.0 <0.9.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/js/
    - assets/CHANGELOG.md
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
