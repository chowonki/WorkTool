name: Transfer wizard browser test
on:
  push:
    branches: [main]
    paths:
      - transfer.html
      - transfer-*.html
      - assets/transfer-wizard.*
      - assets/concept-worktool.css
      - scripts/e2e-transfer-wizard.cjs
      - .github/workflows/transfer-wizard-browser.yml
  pull_request:
    paths:
      - transfer.html
      - transfer-*.html
      - assets/transfer-wizard.*
      - assets/concept-worktool.css
      - scripts/e2e-transfer-wizard.cjs
      - .github/workflows/transfer-wizard-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install Korean font and browser harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Exercise multipage bank transfer workflow
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worktool-wizard.log 2>&1 &
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/e2e-transfer-wizard.cjs
