name: Build annotated screenshot guides
on:
  push:
    branches: [docs/annotated-real-screenshots]
    paths:
      - scripts/annotate-guide.py
      - .github/workflows/build-annotated-screenshots.yml
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum python3-pil
          fc-cache -f
      - name: Render callouts onto real WorkTool screenshots
        run: |
          set -euo pipefail
          python3 scripts/annotate-guide.py
          for name in guide/dispatch-annotated.png guide/transfer-input-annotated.png guide/transfer-review-annotated.png guide/transfer-download-annotated.png; do
            test -s "$name"
            file "$name"
          done
      - name: Commit annotated screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/*-annotated.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: include annotated screenshots for both tools"
          git push origin HEAD:docs/annotated-real-screenshots
