name: Refresh dispatch guide screenshot
on:
  push:
    branches: [docs/dispatch-real-workflow-guide]
    paths:
      - .github/workflows/refresh-dispatch-guide.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up readable Korean screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -f
      - name: Capture actual screens with fictional sample data
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worktool-guide-http.log 2>&1 &
          sleep 2
          npm install --no-save --no-package-lock playwright-core@1.58.2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/capture-quick-guide.cjs
          test -s guide/dispatch-screen.png
      - name: Commit refreshed screenshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh screenshots for real dispatch workflow instructions"
          git push origin HEAD:docs/dispatch-real-workflow-guide
