name: Windows native
on:
  push:
    paths: ['windows/**', 'transfer.html', 'dispatch.html', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['windows/**', 'transfer.html', 'dispatch.html', '.github/workflows/windows-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTool-Windows-x64
          path: windows/artifacts/WorkTool-Windows-x64/
