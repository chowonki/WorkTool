name: Capture visual quick-start screenshots
on:
  push:
    branches: [ux/visual-quick-guide]
    paths:
      - .github/workflows/capture-quick-guide.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font for readable screenshots
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -f
          fc-list :lang=ko family | head -n 10
      - name: Capture the real app with sample data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guide
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/worktool-visual-server.log 2>&1 &
          sleep 2
          npm install --no-save --no-package-lock playwright-core@1.58.2
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node scripts/capture-quick-guide.cjs
          for screenshot in guide/dispatch-screen.png guide/transfer-screen.png guide/transfer-Review.png guide/transfer-Download.png; do
            test -s "$screenshot"
            file "$screenshot"
          done
      - name: Commit screenshot assets to guide branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: include authentic page screenshots for visual quick start"
          git push origin HEAD:ux/visual-quick-guide
