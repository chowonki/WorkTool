name: WorkTool Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [portable-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build portable ZIP
        shell: pwsh
        run: ./windows/build-portable.ps1
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WorkTool-Portable-Windows-x64
          path: windows/artifacts/WorkTool-Portable-Windows-x64.zip
          if-no-files-found: error
